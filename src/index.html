<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Current VOD movie releases by month, generated from TMDB data.">
    <title>when-vod</title>
    <link rel="preload" href="/assets/styles.css" as="style">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <strong>when-vod</strong>
          <span>monthly digital movie releases</span>
        </a>
        <nav class="nav" data-nav aria-label="Primary navigation">
          <a href="/">current</a>
          <a href="/bookmarks/">bookmarks</a>
        </nav>
        <button class="today-button" data-today type="button">today</button>
      </div>
    </header>
    <main class="main" data-app data-page="home">
      <div class="status">Loading releases...</div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="tmdb-mark" aria-label="Credits">
          <p class="meta credit-label">Credits</p>
          <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg" alt="TMDB">
          <p class="meta">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
        </div>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="/datenschutz/">Datenschutz</a>
          <a href="/impressum/">Impressum</a>
          <a href="https://github.com/normware/when-vod" rel="noreferrer">GitHub</a>
          <a href="https://www.themoviedb.org/" rel="noreferrer">TMDB</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
